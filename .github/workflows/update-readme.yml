name: Update README

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get latest commit date
        id: commit_date
        run: |
          DATE=$(git log -1 --format=%ad --date=format:'%B %-d, %Y')
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Update README
        run: |
          sed -i "s/Last Updated: <!-- LAST_UPDATED -->/Last Updated: ${{ steps.commit_date.outputs.date }} <!-- LAST_UPDATED -->/" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "docs: update repository stats"
            git push
          fi
